project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "modules/*.qmd"
  # Only the web-ready derivatives ship. The print-resolution logo masters and
  # the source TTF collections stay out of _site and out of the deployment.
  resources:
    - "assets/fonts/web/*.woff2"
    - "assets/logo/smu-libraries-nav.png"
    - "assets/logo/smu-libraries-footer.png"

lang: en

website:
  title: "LIB002"
  description: "Graduate Research Essentials from SMU Libraries"
  site-url: "https://smu-libraries.github.io/lib002/"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    title: "LIB002"
    logo: assets/logo/smu-libraries-nav.png
    logo-alt: "SMU Libraries"
    left:
      - text: "Explore modules"
        menu:
          - text: "Introduction to Library Services"
            href: modules/library-services.qmd
          - text: "Literature Review and Reference Management"
            href: modules/literature-review.qmd
          - text: "Working with Data"
            href: modules/working-with-data.qmd
          - text: "Research Data Management"
            href: modules/research-data-management.qmd
          - text: "Publishing and Research Impact"
            href: modules/publishing-impact.qmd
      - text: "Support"
        href: support.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    border: false
    # The back-to-top button is fixed to the bottom centre of the viewport, so
    # the centre slot is left empty; anything placed there gets covered.
    left: "LIB002: Graduate Research Essentials — developed by SMU Libraries"
    right:
      - text: "Support"
        href: support.qmd
      - text: "About"
        href: about.qmd

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    # The article grid caps content at 799px and reserves 272px margin columns
    # this site does not use, which left the H5P books narrower than the width
    # H5P specifies for them. Full layout removes that cap; the shared content
    # width is then set in assets/styles.scss so every page lines up.
    page-layout: full
    toc: false
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
